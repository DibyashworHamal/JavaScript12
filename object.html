<html>
<head>
  <title>Student Object</title>
</head>
<body>
  <h3>Create Student Object</h3>
  <input type="text" id="name" placeholder="Enter student name">
  <input type="number" id="age" placeholder="Enter age">
  <input type="text" id="course" placeholder="Enter course">
  <button onclick="showStudent()">Display Details</button>
  <div id="result"></div>

  <script>
    function showStudent() {
      let student = {
        name: document.getElementById("name").value,
        age: Number(document.getElementById("age").value),
        course: document.getElementById("course").value,
        getDetails: function () {
          return "Name: <b>" + this.name + "</b><br>" +
                 "Age: <b>" + this.age + "</b><br>" +
                 "Course: <b>" + this.course + "</b>";
        }
      };

      document.getElementById("result").innerHTML = student.getDetails();
    }
  </script>
</body>
</html>
