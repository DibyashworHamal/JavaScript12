<html>
<head>
<title>Simple Interest Calculator</title>
</head>
<body>
<h2>calculation of simple interest</h2>
<script>
let p = 10000;
let t = 5;
let r = 7.5;
let SI = (p*t*r)/100;
document.write("<p><b>Principle:</b> Rs. " + p + "</p>");
document.write("<p><b>Time:</b> " + t + " years</p>");
document.write("<p><b>Rate:</b> " + r + " %</p>");
document.write("<hr>");
document.write("<h3>Simple Interest = Rs. " + SI + " </h3>");
</script>
</body>
</html>
